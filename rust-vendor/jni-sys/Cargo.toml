[dependencies.jni-sys-macros]
version = "0.4.1"

[dev-dependencies.trybuild]
version = "1"

[lib]
name = "jni_sys"
path = "src/lib.rs"

[package]
authors = ["Steven Fackler <sfackler@gmail.com>", "Robert Bragg <robert@sixbynine.org>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["external-ffi-bindings"]
description = "Rust definitions corresponding to jni.h"
documentation = "https://docs.rs/jni-sys"
edition = "2021"
exclude = ["/.github", "/tests"]
keywords = ["java", "jni"]
license = "MIT OR Apache-2.0"
name = "jni-sys"
readme = "README.md"
repository = "https://github.com/jni-rs/jni-sys"
rust-version = "1.76.0"
version = "0.4.1"
